<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Application</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="quiz-container">

        <h1>🧠 Quiz Challenge</h1>
        <p class="subtitle">Test Your Knowledge!</p>

        <div id="quiz-box">

            <div class="quiz-info">
                <span id="question-number">Question 1</span>
                <span id="score">Score: 0</span>
            </div>

            <h2 id="question">Question will appear here</h2>

            <div id="options-container">
                <button class="option-btn">Option 1</button>
                <button class="option-btn">Option 2</button>
                <button class="option-btn">Option 3</button>
                <button class="option-btn">Option 4</button>
            </div>

            <button id="next-btn">Next Question →</button>

        </div>

        <div id="result-box" class="hide">
            <h2>🎉 Quiz Completed!</h2>
            <h3 id="final-score">Your Score: 0</h3>
            <p id="percentage">Percentage: 0%</p>
            <button id="restart-btn">Restart Quiz</button>
        </div>

    </div>

    <script src="js/script.js"></script>

</body>
</html>
